<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Будешь моей? 💕</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e8 0%, #ffe8f1 50%, #ffc9dd 100%);
    color: #4a1d36;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    text-align: center;
    overflow: hidden;
  }
  .emoji-rain {
    position: fixed;
    top: -50px;
    font-size: 28px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 0;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.8; }
  }
  .cat {
    font-size: 110px;
    margin-bottom: 8px;
    filter: drop-shadow(0 6px 10px rgba(255, 90, 140, 0.35));
    animation: wiggle 2.5s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.05); }
  }
  h1 {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #c2185b;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 #fff;
  }
  .question {
    font-size: 24px;
    font-weight: 600;
    margin: 12px 0 30px;
    color: #4a1d36;
    max-width: 320px;
    line-height: 1.3;
  }
  .hint {
    min-height: 24px;
    font-size: 15px;
    color: #a0366a;
    margin-bottom: 18px;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hint.show { opacity: 1; }
  .buttons {
    position: relative;
    width: 100%;
    max-width: 360px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    border-radius: 999px;
    transition: transform 0.2s, box-shadow 0.2s, width 0.3s, height 0.3s, font-size 0.3s;
    user-select: none;
  }
  .yes {
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: white;
    padding: 20px 44px;
    font-size: 24px;
    box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
  }
  .yes:hover { transform: scale(1.08); box-shadow: 0 12px 28px rgba(34, 197, 94, 0.55); }
  .yes:active { transform: scale(0.98); }
  .no {
    background: #ffe3ee;
    color: #c2185b;
    padding: 14px 28px;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(194, 24, 91, 0.2);
    position: relative;
  }
  .no.floating { position: fixed; z-index: 10; }
  /* Final screen */
  .final {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ff9ec7 0%, #ffd6e8 100%);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    z-index: 100;
    animation: fadeIn 0.6s ease-out;
  }
  .final.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .final .heart {
    font-size: 120px;
    animation: beat 1s ease-in-out infinite;
    margin-bottom: 16px;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%, 75% { transform: scale(1.15); }
    50% { transform: scale(0.95); }
  }
  .final h2 {
    font-size: 32px;
    color: #b8124d;
    margin-bottom: 14px;
    font-weight: 800;
    text-shadow: 0 2px 0 #fff;
  }
  .final p {
    font-size: 20px;
    color: #4a1d36;
    max-width: 340px;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .signature {
    margin-top: 18px;
    font-size: 16px;
    color: #a0366a;
    font-style: italic;
  }
  @media (max-width: 380px) {
    h1 { font-size: 26px; }
    .question { font-size: 20px; }
    .cat { font-size: 90px; }
    .yes { padding: 18px 36px; font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="cat">🐱</div>
  <h1>ПОЖАЛУЙСТА</h1>
  <p class="question" id="question">Ты будешь моей Валентинкой? 💕</p>
  <p class="hint" id="hint"></p>
  <div class="buttons" id="buttons">
    <button class="yes" id="yesBtn">ДА 💖</button>
    <button class="no" id="noBtn">Нет</button>
  </div>

  <div class="final" id="final">
    <div class="heart">💖</div>
    <h2>Я так и знал(а)! 🥰</h2>
    <p id="finalMessage">Ты сделал(а) меня самым счастливым человеком на свете!</p>
    <p class="signature">Я тебя очень люблю 💕</p>
  </div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const hint = document.getElementById('hint');
  const question = document.getElementById('question');
  const finalScreen = document.getElementById('final');

  const hints = [
    "Ты уверена? 🥺",
    "Подумай ещё раз... 💭",
    "Пожалуйста, не отказывай! 🙏",
    "Это твой последний шанс! 😢",
    "Серьёзно?? 💔",
    "Ну хватит, нажми ДА! 😭",
    "Кнопка «Нет» устала от тебя 😤"
  ];

  let step = 0;
  let floating = false;

  function moveNo() {
    const btnRect = noBtn.getBoundingClientRect();
    if (!floating) {
      noBtn.classList.add('floating');
      noBtn.style.left = btnRect.left + 'px';
      noBtn.style.top = btnRect.top + 'px';
      floating = true;
    }
    const maxX = window.innerWidth - noBtn.offsetWidth - 10;
    const maxY = window.innerHeight - noBtn.offsetHeight - 10;
    const x = Math.max(10, Math.random() * maxX);
    const y = Math.max(10, Math.random() * maxY);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    if (step < hints.length) {
      hint.textContent = hints[step];
      hint.classList.add('show');
      step++;
    }

    if (step >= 3) {
      const scale = Math.max(0.4, 1 - step * 0.12);
      noBtn.style.transform = `scale(${scale})`;
    }

    yesBtn.style.transform = `scale(${1 + step * 0.08})`;
  }

  // Dodge on hover and on touch — covers desktop and mobile
  noBtn.addEventListener('mouseover', moveNo);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNo(); }, { passive: false });
  noBtn.addEventListener('click', moveNo);

  yesBtn.addEventListener('click', () => {
    finalScreen.classList.add('show');
    launchEmojiRain();
  });

  function launchEmojiRain() {
    const emojis = ['💖', '💕', '💗', '💓', '✨', '🌸', '💘', '💞'];
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'emoji-rain';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (2 + Math.random() * 3) + 's';
        el.style.fontSize = (20 + Math.random() * 20) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5500);
      }, i * 80);
    }
  }
</script>
</body>
</html>
